<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FANTACO 觸覺測試</title>
<style>body{font:17px system-ui;background:#f5f5f7;color:#202124;max-width:540px;margin:32px auto;padding:20px}h1{font-size:26px}section{background:white;padding:16px;margin:12px 0;border-radius:16px}button,label.direct{display:block;padding:14px;border:0;border-radius:12px;background:#ececf0;font:inherit;width:100%;box-sizing:border-box}small{display:block;font-size:12px;color:#636366;margin-top:8px}output{display:block;white-space:pre-wrap;font-size:12px}#legacy{position:fixed;left:-100px;top:0;opacity:.001;pointer-events:none}</style>
<h1>觸覺測試</h1><p>沒有 iPhone 實測；請逐一操作，自己判斷有沒有震動。</p>
<section><input id="direct" type="checkbox" switch aria-label="直接點 switch"><small>直接點 switch 本體：Safari 17.4 起有此控制項；系統設定與硬體允許時，最可能有原生觸覺。</small></section>
<section><label class="direct" for="real">直接點 label</label><input id="real" type="checkbox" switch><small>真實點 label，保留瀏覽器預設動作；新版 WebKit 仍可傳遞 trusted 點擊。</small></section>
<label id="legacy"><input id="hiddenSwitch" type="checkbox" switch tabindex="-1"></label><main></main><output id="log"></output>
<script>
const legacy=document.querySelector('#legacy'),input=document.querySelector('#hiddenSwitch'),log=document.querySelector('#log');
const report=(name,e)=>log.textContent=`${name}\n事件 trusted=${e?.isTrusted}\nuserActivation=${navigator.userActivation?.isActive}\nstandalone=${matchMedia('(display-mode:standalone)').matches || navigator.standalone || false}\n${navigator.userAgent}`;
for(const type of ['touchend','pointerup','click','touchstart','touchmove']) {
 const section=document.createElement('section');const button=document.createElement('button');
 button.textContent=type+' 內 label.click()';button.style.touchAction='none';
 button.addEventListener(type,e=>{if(e.cancelable)e.preventDefault();legacy.click();report(type,e);},{passive:false});
 const note=document.createElement('small');note.textContent='舊引擎盡力嘗試；fc1ef83 修正後因非 trusted click 不震。'+(type==='touchmove'?'請在此按住滑動；move 不是可靠的使用者啟用。':'需實際手勢；不能由切換成功判定有震動。');
 section.append(button,note);document.querySelector('main').append(section);
}
for(const [name,fn,note] of [
 ['click 內 input.click()',()=>input.click(),'程式 click 非 trusted；不能當成可靠 iOS 觸覺方法。'],
 ['checked = !checked',()=>input.checked=!input.checked,'只改值，沒有原生點擊，不預期震動。'],
 ['navigator.vibrate',()=>navigator.vibrate?.(30),'iOS Safari 沒有此 API；Android 支援仍取決於硬體與設定。'],
 ['延遲 500ms label.click()',()=>setTimeout(()=>legacy.click(),500),'離開同步手勢且非 trusted，不預期可靠觸覺。']]){
 const section=document.createElement('section');const button=document.createElement('button');button.textContent=name;
 button.onclick=e=>{fn();report(name,e)};const small=document.createElement('small');small.textContent=note;section.append(button,small);document.querySelector('main').append(section);
}
input.addEventListener('click',e=>{document.documentElement.dataset.forwardedTrusted=String(e.isTrusted)});
</script></html>
